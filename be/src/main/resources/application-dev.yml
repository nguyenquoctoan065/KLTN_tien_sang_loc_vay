# Profile dev: Cloudinary + Gemini thật. Khóa đọc từ be/.env (KEY=VALUE, đã nằm trong .gitignore) hoặc biến môi trường:
#   CLOUDINARY_URL=cloudinary://<api_key>:<api_secret>@<cloud_name>
#   GEMINI_API_KEY=<khóa từ Google AI Studio>
# Đường dẫn .env tính từ thư mục chạy (be/). Không có mạng/khóa: thêm profile local (-Dspring-boot.run.profiles=dev,local).
spring:
  config:
    import: optional:file:.env[.properties]
  # Dữ liệu lịch sử cho báo cáo (db/dev/V1000__dev_history.sql) chỉ chạy ở profile dev. out-of-order để các migration chính
  # V11, V12… thêm sau này vẫn áp dụng được trên DB dev đã có V1000.
  flyway:
    locations: classpath:db/migration,classpath:db/dev
    out-of-order: true
app:
  otp:
    fixed-code: "123456"
  storage:
    folder: tien-sang-loc-vay/dev
  ocr:
    allow-specimen: true      # môi trường thử nghiệm dùng giấy tờ mẫu (tests/e2e/files); mặc định false
