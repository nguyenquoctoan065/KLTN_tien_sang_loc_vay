# Chạy PostgreSQL cho phát triển: docker compose up -d
# Bảng và dữ liệu mẫu do Flyway của backend tạo khi khởi động (be/src/main/resources/db/migration).
# Database chỉ còn là PostgreSQL rỗng, nên nếu volume cũ đã nạp sẵn V1/V2 bằng initdb thì xóa đi: docker compose down -v
services:
  db:
    image: postgres:16
    container_name: tien-sang-loc-vay-db
    environment:
      POSTGRES_DB: tien_sang_loc_vay
      POSTGRES_USER: tiensangloc
      POSTGRES_PASSWORD: tiensangloc123
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5434:5432"   # 5432 bị dịch vụ Windows postgresql-x64-18 chiếm, 5433 dùng cho dự án khác
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
